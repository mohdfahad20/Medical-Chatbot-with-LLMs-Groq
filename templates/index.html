<!DOCTYPE html>
<html>
<head>
    <title>Medical Chatbot</title>
    <!-- Bootstrap + FontAwesome -->
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.1.1/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.5.0/css/all.css">
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
</head>
<body>
<div class="container-fluid h-100">
    <div class="row justify-content-center h-100">
        <div class="col-md-8 col-xl-6 chat">
            <div class="card">
                <div class="card-header msg_head">
                    <div class="d-flex bd-highlight">
                        <div class="img_cont">
                            <img src="https://cdn-icons-png.flaticon.com/512/387/387569.png" class="rounded-circle user_img">
                            <span class="online_icon"></span>
                        </div>
                        <div class="user_info">
                            <span>Medical Chatbot</span>
                            <p>Ask me anything!</p>
                        </div>
                    </div>
                </div>

                <div id="chat-box" class="card-body msg_card_body">
                    <!-- Messages will appear here -->
                </div>

                <div class="card-footer">
                    <form id="messageArea" class="input-group">
                        <input type="text" id="user-input" name="msg" placeholder="Type your message..." autocomplete="off" class="form-control type_msg" required/>
                        <div class="input-group-append">
                            <button type="submit" class="input-group-text send_btn"><i class="fas fa-location-arrow"></i></button>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>
</div>

<script>
$(document).ready(function() {
    $("#messageArea").on("submit", function(event) {
        event.preventDefault();
        const date = new Date();
        const str_time = date.getHours() + ":" + date.getMinutes();

        const userText = $("#user-input").val();
        if (!userText) return;

        // Add user message
        const userHtml = `
        <div class="d-flex justify-content-end mb-4">
            <div class="msg_cotainer_send">${userText}<span class="msg_time_send">${str_time}</span></div>
            <div class="img_cont_msg"><img src="https://i.ibb.co/d5b84Xw/Untitled-design.png" class="rounded-circle user_img_msg"></div>
        </div>`;
        $("#chat-box").append(userHtml);
        $("#user-input").val("");

        // Send to FastAPI
        $.ajax({
            url: "/chat",
            type: "POST",
            contentType: "application/json",
            data: JSON.stringify({ query: userText }),
        }).done(function(data) {
            const botHtml = `
            <div class="d-flex justify-content-start mb-4">
                <div class="img_cont_msg"><img src="https://cdn-icons-png.flaticon.com/512/387/387569.png" class="rounded-circle user_img_msg"></div>
                <div class="msg_cotainer">${data.answer}<span class="msg_time">${str_time}</span></div>
            </div>`;
            $("#chat-box").append(botHtml);
            $("#chat-box").scrollTop($("#chat-box")[0].scrollHeight);
        });
    });
});
</script>

</body>
</html>
